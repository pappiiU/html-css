<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPC-game</title>
  <link rel="stylesheet" href="styles/10-RPC.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
    <button onclick="
    PlayGame('rock');
  " class="move-button"><img  src="images/rock-emoji.png" class="move-icon"></button>

  <button onclick="
  PlayGame('paper')
  " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>

  <button onclick="
  PlayGame('scissors');
  " class="move-button"><img src="images/scissors-emoji.png" class="move-icon"></button>

<p class="js-result result"></p>
<p class="js-moves"></p>
<p class="js-score score"></p>

  <button onclick="
   score.wins = 0;
   score.losses = 0;
   score.ties = 0;
   localStorage.removeItem('score');
   updateScoreElements();
  " class="reset-score-button">reset Score</button>

  <script src="10-RPC.JS"></script>
</body>
</html>
