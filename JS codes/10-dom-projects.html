<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
  <style>
    body{
      font-family: arial;
    }

    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed{
      background-color: rgb(204, 204, 204);
      color: black;
    }
    
    .cost-input{
      font-size: 15px;
      padding: 10px;
    }

    .calculate-button{
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
    }
  </style>
</head>
<body>
  <p>YouTube Subscribe button</p>
  <button onclick="
   subscribe();
  " class="js-subscribe-button subscribe-button">
  Subscribe</button>

  <p>Amazon Shipping Calculator</p>
<input placeholder="cost of order"
class="js-cost-input cost-input" onkeydown="
 handleCostkeydown(event);
">
  <button class="calculate-button" onclick="
  CalculateTotal();
  ">Calculate</button>
  <p class="js-total-cost"></p>

  <script>
      function handleCostkeydown(event) {
        if(event.key === 'Enter') {
    CalculateTotal();
  }
    }

    function CalculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);
      console.log(cost);
      if(cost < 40) {
        cost = cost + 10;
        console.log(cost);
      }
      document.querySelector('.js-total-cost')
      .innerHTML = `$${cost}`
    }

    function subscribe() {const buttonElement = document.querySelector('.js-subscribe-button');
   
    
    if (buttonElement.innerHTML === 'Subscribe') {
      buttonElement.innerHTML = 'Subscribed';
      buttonElement.classList.add('is-subscribed');
    } else {
      buttonElement.innerHTML = 'Subscribe';
      buttonElement.classList.remove
      ('is-subscribed');
    }

    }
  </script>
</body>
</html>
