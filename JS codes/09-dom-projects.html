<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
</head>
<body>
  <p>YouTube Subcribe button</p>
  <button onclick="
   subscribe();
  " class="js-subscribe-button">
  Subscribe</button>

  <p>Amazon Shipping Calculator</p>
<input placeholder="cost of order"
class="js-cost-input" onkeydown="
 handleCostkeydown(event);
">
  <button onclick="
  CalculateTotal();
  ">Calculate</button>
  <p class="js-total-cost"></p>

  <script>
      function handleCostkeydown(event) {
        if(event.key === 'Enter') {
    CalculateTotal();
  }
    }

    function CalculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);
      console.log(cost);
      if(cost < 40) {
        cost = cost + 10;
        console.log(cost);
      }
      document.querySelector('.js-total-cost')
      .innerHTML = `$${cost}`
    }

    function subscribe() {const buttonElement = document.querySelector('.js-subscribe-button');
   
    
    if(buttonElement.innerHTML === 'Subcribe') {
      buttonElement.innerHTML = 'Subcribed';
    } else {
      buttonElement.innerHTML = 'Subcribe';
    }

    }
  </script>
</body>
</html>
